[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

[project]
name = "ciris-lens-core"
description = "Science-layer runtime for the CIRIS federation: cohort routing, manifold-conformity scoring, signed detection events"
readme = "README.md"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "CIRIS AI", email = "hello@ciris.ai" }]
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Distributed Computing",
]
# v0.1.0 — pip-install-time subsumption mirroring edge's pattern.
# `pip install ciris-lens-core` pulls `ciris-persist` (which
# transitively pulls `ciris-verify` and the build-sign / build-verify
# console scripts). Deployed lens + agent get one install command for
# the whole lens+persist+verify stack.
#
# EXACT pin to v3.6.9 — the CIRIS 3.0 in-process cohabitation
# convergence pin (CIRISLensCore#22). For agent + NodeCore + LensCore
# co-resident in one process, every consumer must link ONE identical
# ciris-persist: a single tokio runtime, a single process-singleton
# Engine. A version RANGE would let pip resolve LensCore to a
# different patch than NodeCore/agent and break the singleton.
# Exact `==` is the contract.
#
# v3.6.9 is lens-core's embedded-cdylib cohabitation point. NOTE:
# the federation's canonical *wheel* triple (CIRISConformance
# matrices/current.yaml) has advanced to persist 3.7.0 / verify
# 4.6.0 / edge 1.1.4, and edge's own Python persist pin is the range
# `>=3.6.3,<4` so its wheel cohabits a persist-3.7.0 process at
# runtime. lens-core's cdylib still statically links persist v3.6.9
# (Cargo.toml — gated by edge v1.1.4's Rust deps, which trail at
# persist v3.6.9 + verify v4.4.3), so the in-process EXACT pin must
# match what the cdylib embeds: declaring `==3.7.0` here while the
# cdylib carries 3.6.9 would force TWO persist cdylibs into one
# process and break the single-Engine invariant. This advances to
# 3.7.0 in lockstep with the Cargo bump, once CIRISEdge re-converges.
# CIRISEdge v1.1.4 closes CIRISEdge#56 (published wheel built WITH
# transport-http) — relevant to lens-core's edge wheel consumers but
# not a Rust-source change vs v1.1.3.
#
# Persist v2.0.0 "Federation Ready" (#95 cohabitation accessors —
# closes #92, unblocks CIRISLensCore#10 PyO3 half) + v1.11.0's
# Engine::receive_and_persist ingest facade (#89) are the primitives
# CIRISLensCore#10's relay handler builds on. verify v4.4.3 is
# transitive via persist + edge — single version across the tree.
#
# DEPLOYMENT NOTE — libtss2: persist v1.10.0 (CIRISPersist#87)
# auto-enables ciris-keyring's `tpm` feature for Linux targets;
# cargo's additive feature unification forces it onto every
# downstream Linux build. Building tss-esapi links system libtss2.
# Any Linux host running the 3.0 shared-engine process needs
# `libtss2` installed — a real deployment dependency, not just CI.
# Lens-core's CI installs `libtss2-dev` on its Linux jobs (mirrors
# CIRISEdge#12). Re-pin in lockstep with edge + NodeCore + agent.
dependencies = [
    "ciris-persist==3.6.9",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://ciris.ai"
Repository = "https://github.com/CIRISAI/CIRISLensCore"
Issues = "https://github.com/CIRISAI/CIRISLensCore/issues"

[tool.maturin]
features = ["python"]
module-name = "ciris_lens_core"
# abi3-py311 — one wheel covers Python 3.11+ per the same matrix
# precedent persist + edge + verify use. CIRISLensCore ships three
# platform wheels: linux-x86_64, linux-aarch64, darwin-aarch64
# (darwin-x86_64 omitted per GitHub Actions Intel macOS runner
# capacity issues — matches persist/edge exactly).
python-source = "python"
strip = true
